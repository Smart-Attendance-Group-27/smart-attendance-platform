name: Deployment CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deployment-ci.yml"
      - "deployment/**"
      - "database/migrations/**"
      - "database/smart_attendance_db_clean.sql"
      - "docker-compose.production.yml"
      - "apps/web/Dockerfile"
      - "services/core-backend/Dockerfile"
      - "services/core-backend/requirements.txt"
      - "services/face-verification/Dockerfile"
      - "services/face-verification/requirements.txt"
      - "deployment/keycloak/Dockerfile"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deployment-ci.yml"
      - "deployment/**"
      - "database/migrations/**"
      - "database/smart_attendance_db_clean.sql"
      - "docker-compose.production.yml"
      - "apps/web/Dockerfile"
      - "services/core-backend/Dockerfile"
      - "services/core-backend/requirements.txt"
      - "services/face-verification/Dockerfile"
      - "services/face-verification/requirements.txt"
      - "deployment/keycloak/Dockerfile"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-containers:
    name: Validate and build production containers
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Confirm the example fails closed
        run: |
          if python deployment/validate_env.py deployment/mvp.env.example; then
            echo "Example unexpectedly passed with placeholder values"
            exit 1
          fi

      - name: Validate production Compose model
        run: |
          docker compose --env-file deployment/mvp.env.example -f docker-compose.production.yml config --quiet
          docker compose --env-file deployment/private.env.example -f deployment/compose.app.yml config --quiet
          docker compose --env-file deployment/private.env.example -f deployment/compose.face.yml config --quiet
          docker compose --env-file deployment/public.env.example -f deployment/compose.ingress.yml config --quiet

      - name: Validate HTTPS ingress rules
        run: |
          docker run --rm \
            --env-file deployment/public.env.example \
            -v "$PWD/deployment/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Rebuild and verify the production schema
        shell: bash
        run: |
          set -euo pipefail
          container=uniattend-deployment-ci-postgres
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" \
            --env POSTGRES_PASSWORD=deployment_ci \
            --env POSTGRES_DB=smart_attendance \
            postgres:16-alpine

          # The official image briefly accepts connections through a temporary
          # server, then restarts PostgreSQL after initializing POSTGRES_DB.
          # Wait for that init phase to finish before accepting pg_isready.
          ready=false
          for attempt in {1..60}; do
            if docker logs "$container" 2>&1 | grep --quiet "PostgreSQL init process complete; ready for start up." \
              && docker exec "$container" pg_isready --username postgres --dbname smart_attendance >/dev/null 2>&1; then
              ready=true
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            docker logs "$container"
            echo "PostgreSQL did not finish initialization"
            exit 1
          fi

          docker exec --interactive "$container" \
            psql --username postgres --dbname smart_attendance --set ON_ERROR_STOP=1 \
            < database/smart_attendance_db_clean.sql
          while IFS= read -r migration; do
            echo "Applying $migration"
            docker exec --interactive "$container" \
              psql --username postgres --dbname smart_attendance --set ON_ERROR_STOP=1 \
              < "$migration"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.sql' ! -name '*_rollback.sql' | sort)
          docker exec --interactive "$container" \
            psql --username postgres --dbname smart_attendance --set ON_ERROR_STOP=1 \
            < deployment/verify_mvp_schema.sql

      - name: Build production images
        run: |
          docker compose --env-file deployment/mvp.env.example -f docker-compose.production.yml build
          docker build -f deployment/keycloak/Dockerfile -t uniattend-keycloak:ci deployment/keycloak

  publish:
    name: Publish immutable release images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: production-containers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish commit-tagged images
        shell: bash
        run: |
          set -euo pipefail
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          source="https://github.com/${GITHUB_REPOSITORY}"
          docker build --label "org.opencontainers.image.source=$source" \
            -f apps/web/Dockerfile --target production \
            -t "$prefix/web:$GITHUB_SHA" .
          docker build --label "org.opencontainers.image.source=$source" \
            -f services/core-backend/Dockerfile \
            -t "$prefix/core-api:$GITHUB_SHA" services/core-backend
          docker build --label "org.opencontainers.image.source=$source" \
            -f services/face-verification/Dockerfile \
            -t "$prefix/face-verification:$GITHUB_SHA" services/face-verification
          docker build --label "org.opencontainers.image.source=$source" \
            -f deployment/keycloak/Dockerfile \
            -t "$prefix/keycloak:$GITHUB_SHA" deployment/keycloak
          for image in web core-api face-verification keycloak; do
            docker push "$prefix/$image:$GITHUB_SHA"
          done
