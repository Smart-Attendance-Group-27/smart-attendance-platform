name: Pilot HTTPS uptime

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check trusted HTTPS endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            https://app.152-53-33-198.sslip.io/login >/dev/null
          curl --fail --silent --show-error --max-time 20 \
            https://api.152-53-33-198.sslip.io/health/db >/dev/null
          curl --fail --silent --show-error --max-time 20 \
            https://auth.152-53-33-198.sslip.io/realms/uniattend/.well-known/openid-configuration >/dev/null
          curl --fail --silent --show-error --max-time 20 \
            https://face.152-53-33-198.sslip.io/health/db >/dev/null
