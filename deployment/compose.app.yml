name: uniattend-app

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    cpus: 0.75
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.25
    logging: *logging

  keycloak:
    image: ${DEPLOY_IMAGE_PREFIX:?Set DEPLOY_IMAGE_PREFIX}/keycloak:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      JAVA_OPTS_APPEND: -Xms256m -Xmx1100m
    volumes:
      - ${KEYCLOAK_REALM_FILE:?Set KEYCLOAK_REALM_FILE}:/opt/keycloak/data/import/uniattend-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - data
      - services
    mem_limit: 1792m
    cpus: 1.25
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; echo -e \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 120s
    logging: *logging
    security_opt:
      - no-new-privileges:true

  core-api:
    image: ${DEPLOY_IMAGE_PREFIX:?Set DEPLOY_IMAGE_PREFIX}/core-api:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    environment:
      APP_ENVIRONMENT: production
      DB_URI: ${CORE_DB_URI:?Set CORE_DB_URI}
      DB_SSL_MODE: require
      DB_POOL_MIN_SIZE: "1"
      DB_POOL_MAX_SIZE: "5"
      DB_COMMAND_TIMEOUT_SECONDS: "15"
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_EXPECTED_ISSUER: ${KEYCLOAK_EXPECTED_ISSUER:?Set KEYCLOAK_EXPECTED_ISSUER}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/uniattend/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: uniattend-api
      KEYCLOAK_AUTHORIZED_CLIENTS: uniattend-mobile,uniattend-web
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: uniattend
      KEYCLOAK_ADMIN_CLIENT_ID: uniattend-provisioner
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET}
      DYNAMIC_QR_HMAC_SECRET: ${DYNAMIC_QR_HMAC_SECRET:?Set DYNAMIC_QR_HMAC_SECRET}
      FACE_VERIFICATION_SERVICE_URL: http://face-verification:8001
      FACE_VERIFICATION_TIMEOUT_SECONDS: "30"
      PILOT_DISABLE_FACE_ATTENDANCE: "true"
      PUSH_WORKER_ENABLED: "false"
      REMINDER_SCHEDULER_ENABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - data
      - services
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 45s
    mem_limit: 768m
    cpus: 1.0
    logging: *logging
    security_opt:
      - no-new-privileges:true

  web:
    image: ${DEPLOY_IMAGE_PREFIX:?Set DEPLOY_IMAGE_PREFIX}/web:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      WEB_API_MODE: live
      CORE_BACKEND_URL: http://core-api:8000
      SESSION_SECRET: ${WEB_SESSION_SECRET:?Set WEB_SESSION_SECRET}
      KEYCLOAK_ISSUER: ${KEYCLOAK_EXPECTED_ISSUER:?Set KEYCLOAK_EXPECTED_ISSUER}
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/uniattend
      KEYCLOAK_CLIENT_ID: uniattend-web
      KEYCLOAK_CLIENT_SECRET: ${WEB_KEYCLOAK_CLIENT_SECRET:?Set WEB_KEYCLOAK_CLIENT_SECRET}
      WEB_BASE_URL: ${WEB_BASE_URL:?Set WEB_BASE_URL}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - services
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    cpus: 0.75
    logging: *logging
    security_opt:
      - no-new-privileges:true

networks:
  data:
    internal: true
  services:
    name: uniattend-services

volumes:
  keycloak-db-data:
  redis-data:
