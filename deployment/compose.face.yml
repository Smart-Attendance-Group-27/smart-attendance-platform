name: uniattend-face

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  face-verification:
    image: ${DEPLOY_IMAGE_PREFIX:?Set DEPLOY_IMAGE_PREFIX}/face-verification:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    environment:
      APP_ENVIRONMENT: production
      DB_URI: ${FACE_DB_URI:?Set FACE_DB_URI}
      DB_SSL_MODE: require
      DB_POOL_MIN_SIZE: "1"
      DB_POOL_MAX_SIZE: "5"
      DB_COMMAND_TIMEOUT_SECONDS: "15"
      FACE_EMBEDDING_ENCRYPTION_KEY: ${FACE_EMBEDDING_ENCRYPTION_KEY:?Set FACE_EMBEDDING_ENCRYPTION_KEY}
      FACE_MODEL_NAME: buffalo_l
      FACE_MODEL_VERSION: "1"
      FACE_EXECUTION_PROVIDER: CPUExecutionProvider
      FACE_CONTEXT_ID: "-1"
      FACE_DETECTION_SIZE: "640"
      FACE_MAX_CONCURRENT_INFERENCES: "1"
      FACE_INFERENCE_QUEUE_TIMEOUT_SECONDS: "20"
      CORE_API_URL: http://core-api:8000
      CORE_API_TIMEOUT_SECONDS: "5"
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - face-model-cache:/home/app/.insightface
    networks:
      - services
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/db', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 180s
    mem_limit: 2g
    cpus: 1.75
    logging: *logging
    security_opt:
      - no-new-privileges:true

networks:
  services:
    name: uniattend-services
    external: true

volumes:
  face-model-cache:
