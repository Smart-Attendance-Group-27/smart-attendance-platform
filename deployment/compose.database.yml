name: uniattend-database

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  application-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-uniattend}
      POSTGRES_USER: ${APP_DB_USER:-uniattend}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    volumes:
      - application-db-data:/var/lib/postgresql/data
    networks:
      - application-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 0.75
    logging: *logging
    security_opt:
      - no-new-privileges:true

networks:
  application-data:
    name: uniattend-application-data
    internal: true

volumes:
  application-db-data:
