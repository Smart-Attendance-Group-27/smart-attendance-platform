<text x="48" y="97" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="48" dy="0">Clients authenticate with Keycloak; Core coordinates attendance and application authorization.</tspan></text>
<text x="80" y="219" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="80" dy="0">Student mobile</tspan></text>
<text x="80" y="249" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="80" dy="0">Expo / React Native</tspan><tspan x="80" dy="24">Camera · location · QR</tspan></text>
<text x="540" y="219" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="540" dy="0">Lecturer + admin web</tspan></text>
<text x="540" y="249" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="540" dy="0">Next.js dashboard</tspan><tspan x="540" dy="24">Server-side BFF</tspan></text>
<text x="1000" y="219" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1000" dy="0">Keycloak</tspan></text>
<text x="1000" y="249" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1000" dy="0">OIDC + PKCE</tspan><tspan x="1000" dy="24">Identity · roles · tokens</tspan></text>
<text x="80" y="499" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="80" dy="0">Face service</tspan></text>
<text x="80" y="529" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="80" dy="0">InsightFace + ONNX Runtime</tspan><tspan x="80" dy="24">Enrollment · matching</tspan><tspan x="80" dy="24">Readiness</tspan></text>
<text x="540" y="499" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="540" dy="0">Core API</tspan></text>
<text x="540" y="529" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="540" dy="0">FastAPI</tspan><tspan x="540" dy="24">Attendance · academic data</tspan><tspan x="540" dy="24">Audit · notifications</tspan></text>
<text x="1000" y="499" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1000" dy="0">Redis</tspan></text>
<text x="1000" y="529" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1000" dy="0">QR metadata cache</tspan><tspan x="1000" dy="24">Database remains authoritative</tspan></text>
<text x="80" y="799" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="80" dy="0">Application PostgreSQL</tspan></text>
<text x="80" y="829" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="80" dy="0">Academic + attendance records</tspan><tspan x="80" dy="24">Audit + notifications</tspan><tspan x="80" dy="24">Encrypted face embeddings</tspan></text>
<text x="540" y="799" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="540" dy="0">Expo Push → FCM</tspan></text>
<text x="540" y="829" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="540" dy="0">Background push worker</tspan><tspan x="540" dy="24">Android delivery</tspan><tspan x="540" dy="24">Enabled by configuration</tspan></text>
<text x="1000" y="799" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700"><tspan x="1000" dy="0">Keycloak PostgreSQL</tspan></text>
<text x="1000" y="829" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1000" dy="0">Separate identity database</tspan><tspan x="1000" dy="24">Credentials + sessions</tspan></text>
