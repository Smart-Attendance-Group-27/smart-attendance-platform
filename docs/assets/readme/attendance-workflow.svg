e="#9fa8b2" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"><g style="clip-path: url(&quot;#_export_1_r_2__shape_attendance-workflow-checkin-qr-1_clip&quot;);"><rect x="-100" y="-100" width="260" height="201" opacity="0"/><path stroke-width="3.5" d="M 0 0 L 60 0"/></g></g></g></g><g transform="matrix(1, 0, 0, 1, 1270, 315)" opacity="1"><g transform="scale(1)"><defs><clipPath id="_export_1_r_2__shape_attendance-workflow-checkin-qr-2_clip"><path d="M -100 -100 L 101 -100 L 101 225 L -100 225 Z"/></clipPath></defs><g fill="none" stroke="#9fa8b2" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"><g style="clip-path: url(&quot;#_export_1_r_2__shape_attendance-workflow-checkin-qr-2_clip&quot;);"><rect x="-100" y="-100" width="201" height="325" opacity="0"/><path stroke-width="3.5" d="M 0 0 L 0 125"/></g></g></g></g><g transform="matrix(1, 0, 0, 1, 1270, 440)" opacity="1"><g transform="scale(1)"><defs><clipPath id="_export_1_r_2__shape_attendance-workflow-checkin-qr-3_clip"><path d="M -160 -100 L 100 -100 L 100 101 L -160 101 Z"/></clipPath></defs><g fill="none" stroke="#9fa8b2" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"><g style="clip-path: url(&quot;#_export_1_r_2__shape_attendance-workflow-checkin-qr-3_clip&quot;);"><rect x="-160" y="-100" width="260" height="201" opacity="0"/><path stroke-width="3.5" d="M 0 0 L -60 0"/></g></g></g></g><g transform="matrix(1, 0, 0, 1, 1210, 440)" opacity="1"><g transform="scale(1)"><defs><clipPath id="_export_1_r_2__shape_attendance-workflow-checkin-qr-4_clip"><path d="M -100 -100 L 101 -100 L 101 150 L -100 150 Z"/></clipPath></defs><g fill="none" stroke="#9fa8b2" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"><g style="clip-path: url(&quot;#_export_1_r_2__shape_attendance-workflow-checkin-qr-4_clip&quot;);"><rect x="-100" y="-100" width="201" height="250" opacity="0"/><path stroke-width="3.5" d="M 0 0 L 0 50"/></g><path d="M 4.999999999999999 41.33974596215561 L 0 50 L -4.999999999999999 41.33974596215561"/></g></g></g><g transform="matrix(1, 0, 0, 1, 1080, 562)" opacity="1"><g transform="scale(1)"><defs><clipPath id="_export_1_r_2__shape_attendance-workflow-qr-close-1_clip"><path d="M -180 -100 L 100 -100 L 100 101 L -180 101 Z"/></clipPath></defs><g fill="none" stroke="#9fa8b2" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"><g style="clip-path: url(&quot;#_export_1_r_2__shape_attendance-workflow-qr-close-1_clip&quot;);"><rect x="-180" y="-100" width="280" height="201" opacity="0"/><path stroke-width="3.5" d="M 0 0 L -80 0"/></g><path d="M -70.9067332602634 5.249999999999999 L -80 0 L -70.9067332602634 -5.249999999999999"/></g></g></g><g transform="matrix(1, 0, 0, 1, 740, 562)" opacity="1"><g transform="scale(1)"><defs><clipPath id="_export_1_r_2__shape_attendance-workflow-close-final-1_clip"><path d="M -180 -100 L 100 -100 L 100 101 L -180 101 Z"/></clipPath></defs><g fill="none" stroke="#9fa8b2" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"><g style="clip-path: url(&quot;#_export_1_r_2__shape_attendance-workflow-close-final-1_clip&quot;);"><rect x="-180" y="-100" width="280" height="201" opacity="0"/><path stroke-width="3.5" d="M 0 0 L -80 0"/></g><path d="M -70.9067332602634 5.249999999999999 L -80 0 L -70.9067332602634 -5.249999999999999"/></g></g></g><g transform="matrix(1, 0, 0, 1, 320, 562)" opacity="1"><g transform="scale(1)"><defs><clipPath id="_export_1_r_2__shape_attendance-workflow-manual-final-1_clip"><path d="M -100 -100 L 180 -100 L 180 101 L -100 101 Z"/></clipPath></defs><g fill="none" stroke="#9fa8b2" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"><g style="clip-path: url(&quot;#_export_1_r_2__shape_attendance-workflow-manual-final-1_clip&quot;);"><rect x="-100" y="-100" width="280" height="201" opacity="0"/><g stroke-width="3.5"><path d="M 0 0 L 80 0" stroke-dasharray="8 10" stroke-dashoffset="0"/></g></g><path d="M 70.9067332602634 -5.249999999999999 L 80 0 L 70.9067332602634 5.249999999999999"/></g></g></g><g id="diagram-labels"><text x="48" y="62" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700"><tspan x="48" dy="0">Attendance verification workflow</tspan></text>
<text x="48" y="97" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400"><tspan x="48" dy="0">Initial check-in and final attendance are distinct states. Face and QR are selected by the lecturer.</tspan></text>
<text x="80" y="208" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"><tspan x="80" dy="0">1. Activate session</tspan></text>
<text x="80" y="239" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="80" dy="0">Timetable + roster</tspan><tspan x="80" dy="24">Geofence + check-in window</tspan></text>
<text x="420" y="208" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"><tspan x="420" dy="0">2. Location check</tspan></text>
<text x="420" y="239" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="420" dy="0">Fresh, accurate reading</tspan><tspan x="420" dy="24">Inside the classroom area</tspan></text>
<text x="760" y="208" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"><tspan x="760" dy="0">3. Face + liveness</tspan></text>
<text x="760" y="239" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="760" dy="0">Challenges + final capture</tspan><tspan x="760" dy="24">Match reference embedding</tspan></text>
<text x="1100" y="208" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"><tspan x="1100" dy="0">4. Initial check-in</tspan></text>
<text x="1100" y="239" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1100" dy="0">Checked in</tspan><tspan x="1100" dy="24">or late checked in</tspan></text>
<text x="742" y="403" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="742" dy="0">Face not required: skip matching</tspan></text>
<text x="80" y="528" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"><tspan x="80" dy="0">Lecturer review</tspan></text>
<text x="80" y="559" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="80" dy="0">Decision + audit reason</tspan><tspan x="80" dy="24">Preserved at session close</tspan></text>
<text x="420" y="528" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"><tspan x="420" dy="0">7. Final attendance</tspan></text>
<text x="420" y="559" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="420" dy="0">Present / Late</tspan><tspan x="420" dy="24">Left early / Absent</tspan></text>
<text x="760" y="528" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700"><tspan x="760" dy="0">6. Close + reconcile</tspan></text>
<text x="760" y="559" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="760" dy="0">Lecturer or automatic close</tspan><tspan x="760" dy="24">Keep manual decisions</tspan></text>
<text x="1100" y="527" fill="#142b43" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700"><tspan x="1100" dy="0">5. QR presence checks</tspan></text>
<text x="1100" y="559" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400"><tspan x="1100" dy="0">Static or rotating batches</tspan><tspan x="1100" dy="24">Pass required QR batches</tspan></text>
<text x="60" y="695" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="60" dy="0">Location exceptions: the lecturer can audit a session-wide geofence waiver; rejected or incomplete attempts can be reviewed.</tspan></text>
<text x="60" y="732" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400"><tspan x="60" dy="0">QR is checked during class. Final outcomes use initial check-in plus the required QR evidence, not the scan alone.</tspan></text></g></svg>
